[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ootp-milestone-tracker"
version = "0.1.0"
description = "Compact local OOTP database viewer and milestone tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyinstaller>=6,<7",
]

[project.scripts]
ootp-milestone-tracker = "ootp_milestone_tracker.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
