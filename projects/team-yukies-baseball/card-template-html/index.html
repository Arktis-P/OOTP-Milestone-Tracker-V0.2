<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>TEAM YUKIES Card Preview v15</title>
<link rel="icon" type="image/png" href="./assets/app-icon.png">
<link rel="shortcut icon" href="./assets/app-icon.ico">
<script src="./theme-v1.js?v=20260927v8"></script>
<link rel="stylesheet" href="./team-yukies-card.css?v=20260927v8">
<link rel="stylesheet" href="./image-adjust-v2.css?v=20260927v8">
<link rel="stylesheet" href="./theme-v1.css?v=20260927v8">
</head>
<body>
<header class="toolbar">
  <div class="toolbar__row toolbar__row--main">
    <div class="toolbar__brand">
      <span class="toolbar__brand-mark">YK</span>
      <div class="toolbar__brand-copy">
        <strong>TEAM YUKIES</strong>
        <span>CARD STUDIO</span>
      </div>
    </div>

    <select id="player-select" hidden aria-hidden="true"></select>

    <div class="toolbar__group toolbar__group--data">
      <span class="toolbar__group-label">DATA</span>
      <label class="toolbar__file-button">
        CSV
        <input id="csv-input" type="file" accept=".csv,text/csv">
      </label>
      <span id="csv-status" class="toolbar__status toolbar__status--wide">loading ../PLAYER_RATINGS.csv…</span>
    </div>

    <div class="toolbar__group">
      <span class="toolbar__group-label">VIEW</span>
      <label class="preview-scale-control">
        <input id="preview-scale" type="range" min="35" max="100" step="5" value="55">
        <output id="preview-scale-value">55%</output>
      </label>
      <button id="theme-toggle" type="button" aria-pressed="false" title="다크 모드로 전환">DARK</button>
    </div>

    <div class="toolbar__group toolbar__group--export">
      <span class="toolbar__group-label">EXPORT</span>
      <button id="save-cards" type="button" class="toolbar__primary">앞/뒤 PNG</button>
      <span id="export-status" class="toolbar__status"></span>
    </div>
  </div>

  <div class="toolbar__row toolbar__row--image image-editor">
    <div class="toolbar__section-title">PLAYER IMAGE</div>

    <div class="toolbar__group">
      <span class="toolbar__group-label">SOURCE</span>
      <label class="toolbar__file-button">
        이미지 선택
        <input id="player-image-input" type="file" accept="image/png,image/webp,image/jpeg">
      </label>
      <span id="image-status" class="toolbar__status"></span>
    </div>

    <div class="toolbar__group toolbar__group--position">
      <span class="toolbar__group-label">POSITION</span>
      <label class="compact-field"><span>X</span><input id="img-x" type="number" step="1" value="0"></label>
      <label class="compact-field"><span>Y</span><input id="img-y" type="number" step="1" value="0"></label>
      <label class="compact-field"><span>W</span><input id="img-width" type="number" min="1" step="1" value="900"></label>
      <label class="compact-field"><span>S</span><input id="img-scale" type="number" min="0.1" max="4" step="0.05" value="1"></label>
    </div>

    <div class="toolbar__group toolbar__group--nudge">
      <span class="toolbar__group-label">NUDGE</span>
      <div class="nudge-pad">
        <button id="nudge-left" type="button" title="왼쪽 1px">←</button>
        <button id="nudge-up" type="button" title="위 1px">↑</button>
        <button id="nudge-down" type="button" title="아래 1px">↓</button>
        <button id="nudge-right" type="button" title="오른쪽 1px">→</button>
      </div>
    </div>

    <div class="toolbar__group toolbar__group--adjust">
      <span class="toolbar__group-label">ADJUST</span>
      <label class="image-adjust-control" title="Brightness">
        <span>BRT</span>
        <input id="img-brightness" type="range" min="50" max="150" step="1" value="100" aria-label="Player image brightness slider">
        <input id="img-brightness-number" class="image-adjust-number" type="number" min="50" max="150" step="1" value="100" aria-label="Player image brightness value">
        <span class="adjust-unit">%</span>
      </label>
      <label class="image-adjust-control" title="Contrast">
        <span>CON</span>
        <input id="img-contrast" type="range" min="50" max="150" step="1" value="100" aria-label="Player image contrast slider">
        <input id="img-contrast-number" class="image-adjust-number" type="number" min="50" max="150" step="1" value="100" aria-label="Player image contrast value">
        <span class="adjust-unit">%</span>
      </label>
      <label class="image-adjust-control" title="Saturation">
        <span>SAT</span>
        <input id="img-saturation" type="range" min="0" max="200" step="1" value="100" aria-label="Player image saturation slider">
        <input id="img-saturation-number" class="image-adjust-number" type="number" min="0" max="200" step="1" value="100" aria-label="Player image saturation value">
        <span class="adjust-unit">%</span>
      </label>
      <button id="img-tone-reset" type="button" title="보정값을 기본값으로 되돌림">Tone Reset</button>
    </div>

    <div class="toolbar__group toolbar__group--outline">
      <span class="toolbar__group-label">OUTLINE</span>
      <label class="outline-color-control" title="Outline color">
        <span>COLOR</span>
        <input id="img-outline-color" type="color" value="#202A43" aria-label="Player image outline color picker">
        <input id="img-outline-hex" class="outline-hex-input" type="text" value="#202A43" maxlength="7" spellcheck="false" aria-label="Player image outline hex color">
      </label>
      <label class="image-adjust-control" title="Outline width">
        <span>WIDTH</span>
        <input id="img-outline-width" type="range" min="0" max="50" step="0.5" value="0" aria-label="Player image outline width slider">
        <input id="img-outline-width-number" class="image-adjust-number" type="number" min="0" max="50" step="0.5" value="0" aria-label="Player image outline width value">
        <span class="adjust-unit">px</span>
      </label>
      <button id="img-outline-reset" type="button" title="아웃라인을 끄고 기본 색상으로 되돌림">Reset</button>
      <span id="adjust-status" class="toolbar__status" title="현재 캐릭터 이미지 보정 상태"></span>
    </div>

    <div class="toolbar__group toolbar__group--actions">
      <span class="toolbar__group-label">ACTIONS</span>
      <button id="img-save" type="button" class="toolbar__primary" title="선수 이미지, 배치, 보정/아웃라인 설정 저장">Save</button>
      <button id="img-reset" type="button">Reset</button>
      <button id="img-clear" type="button">Remove</button>
      <button id="img-copy-layout" type="button">Copy JSON</button>
    </div>

    <span class="image-editor__hint">드래그앤드롭 가능 · 배치/톤/아웃라인은 선수별 저장</span>
  </div>
</header>

<div class="workspace">
  <aside class="player-sidebar">
    <div class="player-sidebar__header">
      <strong>PLAYERS</strong>
      <span id="player-count"></span>
    </div>
    <div id="player-list" class="player-list" role="listbox" aria-label="Player list"></div>
  </aside>

  <main class="preview-area">
    <div class="preview-scroll">
      <div class="stage" id="card-stage">
  <section class="card card--front-editor" id="front-card">
    <img class="card__layer card__background" id="front-background" src="./assets/front-background.png" alt="">
    <img class="card__player" id="front-player" alt="" draggable="false" hidden>
    <img class="card__layer card__overlay" id="front-batter-overlay" src="./assets/front-batter-overlay.png" alt="">
    <img class="card__layer card__overlay" id="front-pitcher-overlay" src="./assets/front-pitcher-overlay.png" alt="" hidden>

    <div class="card__drop-hint">PLAYER IMAGE DROP</div>

    <div class="card__data">
      <div class="t front__ovr"></div>
      <div class="t front__position"></div>
      <div class="t front__number"></div>
      <div class="t front__first"></div>
      <div class="t front__last"></div>
      <div class="front__stats"></div>
      <div class="t front__serial"></div>
    </div>
  </section>

  <section class="card" id="back-card">
    <img class="card__layer card__overlay" id="back-batter-overlay" src="./assets/back-batter-overlay.png" alt="">
    <img class="card__layer card__overlay" id="back-pitcher-overlay" src="./assets/back-pitcher-overlay.png" alt="" hidden>

    <div class="card__data">
      <div class="t back__first"></div>
      <div class="t back__last"></div>
      <div class="t back__position"></div>
      <div class="t back__number"></div>

      <div class="back__profile-block" id="back-profile">
        <div class="back__profile-line"></div>
        <div class="back__profile-line"></div>
        <div class="back__profile-line"></div>
      </div>

      <div class="rating-values"></div>
      <div class="rating-bars"></div>
      <div class="fielding-list"></div>
      <div class="fielding-diamond"></div>
      <div class="pitch-list"></div>
      <div class="t velocity"></div>
      <div class="t back__report"></div>
      <div class="t back__serial"></div>
    </div>
  </section>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="./data/player_images.js?v=20260927v8"></script>
<script src="./team-yukies-card.js?v=20260927v8"></script>
<script src="./pitcher-front-v2.js?v=20260927v8"></script>
<script src="./image-persistence-v1.js?v=20260927v8"></script>
<script src="./image-adjust-v2.js?v=20260927v8"></script>
<script src="./export-v4.js?v=20260927v8"></script>
</body>
</html>
