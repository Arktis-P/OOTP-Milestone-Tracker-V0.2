name: Build Team Yukies Card Launcher

on:
  push:
    branches:
      - gpt/card-yukies
    paths:
      - "projects/team-yukies-baseball/launcher/**"
      - "projects/team-yukies-baseball/card-template-html/assets/app-icon.png"
      - "projects/team-yukies-baseball/card-template-html/assets/app-icon.ico"
      - "projects/team-yukies-baseball/TEAM-YUKIES-Card-Preview.exe"
      - "projects/team-yukies-baseball/open-card-preview.bat"
      - ".github/workflows/build-team-yukies-card-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gpt/card-yukies
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate Windows icon from source PNG
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pillow
          python .\projects\team-yukies-baseball\launcher\make-icon.py

      - name: Build Windows launcher
        shell: powershell
        run: .\projects\team-yukies-baseball\launcher\build-launcher.ps1

      - name: Verify executable icon
        shell: powershell
        run: |
          $exe = Resolve-Path ".\projects\team-yukies-baseball\TEAM-YUKIES-Card-Preview.exe"
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) {
            throw "The launcher executable does not contain an associated icon."
          }
          if ($icon.Width -lt 16 -or $icon.Height -lt 16) {
            throw "The launcher executable icon is invalid: $($icon.Width)x$($icon.Height)"
          }
          Write-Host "Executable icon verified: $($icon.Width)x$($icon.Height)"

      - name: Upload launcher validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-yukies-card-preview-launcher
          path: projects/team-yukies-baseball/TEAM-YUKIES-Card-Preview.exe
          if-no-files-found: error
